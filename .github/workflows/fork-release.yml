name: fork-release
run-name: "fork release ${{ inputs.version || github.ref_name }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0-ar.1, without leading v)"
        required: true
        type: string
  push:
    tags:
      - "v*"

concurrency: fork-release

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Fork-only release pipeline; never run on the upstream repository.
    if: github.repository != 'anomalyco/opencode'
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      # The dispatch input is passed through env, never interpolated into the
      # script text, so special characters cannot inject shell.
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-$GITHUB_REF_NAME}"
          version="${version#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Draft first: installers resolve releases/latest, so the release must
      # only become visible once every binary is uploaded.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ steps.version.outputs.version }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --draft \
              --generate-notes

      # build.ts compiles every target, zips dist/*, and uploads the archives
      # to the release itself when OPENCODE_RELEASE is set (see Script.release).
      - name: Build and upload binaries
        working-directory: packages/opencode
        env:
          OPENCODE_VERSION: ${{ steps.version.outputs.version }}
          OPENCODE_RELEASE: "1"
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: bun run script/build.ts

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ steps.version.outputs.version }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false

name: fork-release
run-name: "fork release ${{ inputs.version || github.ref_name }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0-ar.1, without leading v)"
        required: true
        type: string
  push:
    tags:
      - "v*"

concurrency: fork-release

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    # Fork-only release pipeline; never run on the upstream repository.
    if: github.repository != 'anomalyco/opencode'
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # The dispatch input is passed through env, never interpolated into the
      # script text, so special characters cannot inject shell. The strict
      # format check also keeps newlines and malformed versions out of
      # GITHUB_OUTPUT and the release tag.
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-$GITHUB_REF_NAME}"
          version="$(printf '%s' "$version" | tr -d '[:space:]')"
          version="${version#v}"
          version="${version#V}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'; then
            echo "::error::Invalid version '$version' — expected MAJOR.MINOR.PATCH with optional prerelease (e.g. 1.0.0-ar.1)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Draft first: installers resolve releases/latest, so the release must
      # only become visible once every binary is uploaded. A published tag is
      # never rebuilt in place (that would recreate the asset-less window for
      # users mid-download); a stale draft from a failed run is recreated so
      # its tag target matches the sha this run builds.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ steps.version.outputs.version }}
        run: |
          if state="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$state" = "false" ]; then
              echo "::error::$RELEASE_TAG is already published — bump the version instead of re-releasing it"
              exit 1
            fi
            gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --draft \
            --generate-notes

  cli:
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      # build.ts compiles every target, zips dist/*, and uploads the archives
      # to the release itself when OPENCODE_RELEASE is set (see Script.release).
      - name: Build and upload CLI binaries
        working-directory: packages/opencode
        env:
          OPENCODE_VERSION: ${{ needs.prepare.outputs.version }}
          OPENCODE_RELEASE: "1"
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: bun run script/build.ts

  desktop-windows:
    runs-on: windows-latest
    needs: prepare
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Stamps the desktop package.json version, copies channel icons, and
      # bundles the opencode server (packages/opencode/dist/node) that the
      # Electron main process forks — no separate CLI binary is required.
      - name: Prepare
        working-directory: packages/desktop
        env:
          OPENCODE_VERSION: ${{ needs.prepare.outputs.version }}
          OPENCODE_CHANNEL: prod
        run: bun ./scripts/prepare.ts

      - name: Build
        working-directory: packages/desktop
        env:
          OPENCODE_CHANNEL: prod
        run: bun run build

      # Windows code signing skips itself automatically when the Azure Trusted
      # Signing secrets are absent (script/sign-windows.ps1), so fork builds
      # produce an unsigned installer. OPENCODE_PUBLISH_REPO points the
      # embedded auto-updater at this fork instead of upstream.
      - name: Package
        working-directory: packages/desktop
        env:
          OPENCODE_CHANNEL: prod
          OPENCODE_PUBLISH_REPO: ${{ github.repository }}
        run: npx electron-builder --win --publish never --config electron-builder.config.ts

      - name: Upload desktop installer
        working-directory: packages/desktop
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          ls dist
          gh release upload "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            dist/opencode-desktop-win-x64.exe \
            dist/opencode-desktop-win-x64.exe.blockmap \
            dist/latest.yml

  publish:
    runs-on: ubuntu-latest
    needs: [prepare, cli, desktop-windows]
    timeout-minutes: 10
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ needs.prepare.outputs.version }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --draft=false
